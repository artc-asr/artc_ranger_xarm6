# ros2_control controller set for the xArm6 arm on Ranger Mini 3.0.
#
# Two arm controllers over the same six joints, only ever ONE active at a
# time (they claim different command interfaces, velocity vs position, but
# the hardware can only run each joint in one mode):
#   - arm_velocity_controller (active by default): wbcc_controller (wbc.py)
#     drives the arm as a velocity-controlled joint group, publishing
#     Float64MultiArray to '<ns>/arm_velocity_controller/commands', exactly
#     like the Theron/Kairos UR5e setups already in this workspace.
#   - arm_trajectory_controller (loaded inactive): MoveIt's execution target
#     (FollowJointTrajectory). ranger_xarm6_manipulation's coordinator
#     switches to it before running MoveIt plans.
# Joint names below
# are unprefixed ('joint1'..'joint6') -- ranger_xarm6.launch.py prefixes them
# with the robot_id at launch time (see _prefix_controller_joints there) so
# they match wbc.py's '{ns}_joint1'..'{ns}_joint6' expectation. The two
# top-level controller names (joint_state_broadcaster, arm_velocity_controller)
# are intentionally left unprefixed -- wbc.py and this launch's spawner calls
# both assume those exact names, namespaced only by the node namespace.
#
# Used identically for sim (gz_ros2_control/GazeboSimSystem) and real hardware
# (uf_robot_hardware/UFRobotSystemHardware) -- only the ros2_control hardware
# plugin differs between the two, not this controller set.
controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_position_controller:
      type: position_controllers/JointGroupPositionController

arm_velocity_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: velocity

arm_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Per-joint goal tolerance [rad]: without one, the controller reports
    # success even when the arm never reaches its target (e.g. blocked by
    # contact in Gazebo), and MoveIt passes that success on.
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      joint1: {trajectory: 0.0, goal: 0.02}
      joint2: {trajectory: 0.0, goal: 0.02}
      joint3: {trajectory: 0.0, goal: 0.02}
      joint4: {trajectory: 0.0, goal: 0.02}
      joint5: {trajectory: 0.0, goal: 0.02}
      joint6: {trajectory: 0.0, goal: 0.02}

# Drives the G2 gripper's single actuated joint ('drive_joint'); the other
# five finger/knuckle joints are Gazebo mimic joints (see
# xarm_gripper_macro.xacro's mimic_joint_plugin_gazebo blocks) that follow
# drive_joint automatically, not separate controller targets. Command range
# is the drive_joint URDF limits (radians); command via
# '<ns>/gripper_position_controller/commands' (std_msgs/Float64MultiArray,
# single-element).
gripper_position_controller:
  ros__parameters:
    joints:
      - drive_joint
    interface_name: position
