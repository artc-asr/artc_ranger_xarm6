# MoveIt time-parameterization limits. Joint names are unprefixed:
# launch/move_group.launch.py adds the robot_id prefix (same convention as
# ranger_xarm6_description/config/ros2_controllers.yaml).
# Velocity/acceleration from xarm_moveit_config's xarm6/joint_limits.yaml.
# Default scaling kept low: this arm rides on a mobile base next to people.
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
  joint1: {has_velocity_limits: true, max_velocity: 2.14, has_acceleration_limits: true, max_acceleration: 10.0}
  joint2: {has_velocity_limits: true, max_velocity: 2.14, has_acceleration_limits: true, max_acceleration: 10.0}
  joint3: {has_velocity_limits: true, max_velocity: 2.14, has_acceleration_limits: true, max_acceleration: 10.0}
  joint4: {has_velocity_limits: true, max_velocity: 2.14, has_acceleration_limits: true, max_acceleration: 10.0}
  joint5: {has_velocity_limits: true, max_velocity: 2.14, has_acceleration_limits: true, max_acceleration: 10.0}
  joint6: {has_velocity_limits: true, max_velocity: 2.14, has_acceleration_limits: true, max_acceleration: 10.0}
  drive_joint: {has_velocity_limits: true, max_velocity: 2.0, has_acceleration_limits: true, max_acceleration: 10.0}
