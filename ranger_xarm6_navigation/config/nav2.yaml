# Nav2 for the Ranger Mini 3.0 + xArm6. Written for robot_id robot_a:
# navigation.launch.py replaces every "robot_a" (frames, topics) with the
# robot_id it's given.
#
# The base drives forward and turns on arcs (Ackermann) or spins in place;
# it never crabs under Nav2 (vy = 0), crabbing is left to
# ranger_xarm6_manipulation's final approach. RotationShim spins in place
# towards the path first, Regulated Pure Pursuit follows it. The real
# driver turns a command with v/w < 0.476 m into a spin in place; the sim
# base (base_pose_publisher.py) follows any twist exactly.
#
# The footprint includes the arm at home or stow: the gripper and wrist
# camera hang out to x = -0.49 m behind base_link. Park the arm before
# navigating; other arm poses can reach outside it.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: robot_a_map
    robot_base_frame: robot_a_base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Default BTs: navigate_to_pose_w_replanning_and_recovery.xml and
    # navigate_through_poses_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5    # never crabs: vy is always 0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 15.0   # spinning to the path makes no progress
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: true

    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Spin in place until within 45 deg of the path, then hand over.
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0

      # Regulated Pure Pursuit
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true       # final heading: spin in place
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: robot_a_odom
      robot_base_frame: robot_a_base_link
      rolling_window: true
      # Wide: the lidar sees a 0.4 m-tall obstacle only beyond ~3.6 m
      # (lowest beam -7 deg from 0.84 m); it has to be marked from there.
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.38, 0.27], [0.38, -0.27], [-0.53, -0.27], [-0.53, 0.27]]"
      # collision_monitor's approach uses this footprint too. 6 cm was too
      # much: the base then couldn't turn around beside tables (sim).
      footprint_padding: 0.03
      plugins: [obstacle_layer, inflation_layer]
      # Voxel, not the 2D ObstacleLayer: a 2D layer clears an obstacle with
      # every ray that passes above it, and up close all of them do.
      obstacle_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        mark_threshold: 0
        publish_voxel_map: false
        footprint_clearing_enabled: true   # the lidar sees the arm
        observation_sources: lidar front_depth front_depth_clear front_memory
        lidar:
          topic: /robot_a/livox/lidar
          data_type: PointCloud2
          # The band the robot can hit; above the floor, which the
          # lidar only sees far away.
          min_obstacle_height: 0.15
          max_obstacle_height: 1.5
          obstacle_max_range: 6.0
          raytrace_max_range: 7.0
          marking: true
          clearing: true
        front_depth:
          # Front D435i (fixed_cam1, 0.69 m up, level): the low obstacles
          # the lidar can't see near the robot. It sees the floor from ~1 m
          # ahead of the lens, a 0.15 m-tall obstacle from 1.0 m, a 0.4 m
          # one from 0.55 m; what it marked on the way in stays marked.
          # Out to 3 m, where the D435i's depth is still ~3 cm good; 5 cm
          # voxels (depth_to_cloud, front_depth.launch.py).
          topic: /robot_a/fixed_cam1_camera/depth/points_nav
          data_type: PointCloud2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          obstacle_max_range: 3.0
          marking: true
          clearing: false
        front_depth_clear:
          # The same cloud, floor included, only to clear: a source's height
          # band filters its clearing rays too, and it's the rays to the
          # floor that clear an obstacle that has gone.
          topic: /robot_a/fixed_cam1_camera/depth/points_nav
          data_type: PointCloud2
          min_obstacle_height: -0.5
          max_obstacle_height: 1.5
          raytrace_max_range: 3.0
          marking: false
          clearing: true
        front_memory:
          # What the front camera has seen (obstacle_memory, odom). A low
          # obstacle close to the robot is below the camera's view, and
          # Nav2's recoveries clear the costmaps: without this the planner
          # then routed through a 0.21 m box beside the goal and the
          # controller pushed into the collision monitor's stop (sim).
          # Marking only; the cloud's frame is odom, so its "sensor" is
          # odom's origin: ranges measured from there, hence huge.
          topic: /robot_a/fixed_cam1_camera/depth/obstacle_memory
          data_type: PointCloud2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          obstacle_max_range: 1000.0
          marking: true
          clearing: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.6
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: robot_a_map
      robot_base_frame: robot_a_base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.38, 0.27], [0.38, -0.27], [-0.53, -0.27], [-0.53, 0.27]]"
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /robot_a/map
        map_subscribe_transient_local: true
      # Voxel, not the 2D ObstacleLayer: a 2D layer clears an obstacle with
      # every ray that passes above it, and up close all of them do.
      obstacle_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        mark_threshold: 0
        publish_voxel_map: false
        footprint_clearing_enabled: true
        observation_sources: lidar front_depth front_depth_clear front_memory
        lidar:
          topic: /robot_a/livox/lidar
          data_type: PointCloud2
          min_obstacle_height: 0.15
          max_obstacle_height: 1.5
          obstacle_max_range: 6.0
          raytrace_max_range: 7.0
          marking: true
          clearing: true
        front_depth:
          # Front D435i (fixed_cam1, 0.69 m up, level): the low obstacles
          # the lidar can't see near the robot. It sees the floor from ~1 m
          # ahead of the lens, a 0.15 m-tall obstacle from 1.0 m, a 0.4 m
          # one from 0.55 m; what it marked on the way in stays marked.
          # Out to 3 m, where the D435i's depth is still ~3 cm good; 5 cm
          # voxels (depth_to_cloud, front_depth.launch.py).
          topic: /robot_a/fixed_cam1_camera/depth/points_nav
          data_type: PointCloud2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          obstacle_max_range: 3.0
          marking: true
          clearing: false
        front_depth_clear:
          # The same cloud, floor included, only to clear: a source's height
          # band filters its clearing rays too, and it's the rays to the
          # floor that clear an obstacle that has gone.
          topic: /robot_a/fixed_cam1_camera/depth/points_nav
          data_type: PointCloud2
          min_obstacle_height: -0.5
          max_obstacle_height: 1.5
          raytrace_max_range: 3.0
          marking: false
          clearing: true
        front_memory:
          # What the front camera has seen (obstacle_memory, odom). A low
          # obstacle close to the robot is below the camera's view, and
          # Nav2's recoveries clear the costmaps: without this the planner
          # then routed through a 0.21 m box beside the goal and the
          # controller pushed into the collision monitor's stop (sim).
          # Marking only; the cloud's frame is odom, so its "sensor" is
          # odom's origin: ranges measured from there, hence huge.
          topic: /robot_a/fixed_cam1_camera/depth/obstacle_memory
          data_type: PointCloud2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          obstacle_max_range: 1000.0
          marking: true
          clearing: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.6
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: robot_a_map
    topic_name: map
    # yaml_filename: set by navigation.launch.py

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.2
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: robot_a_odom
    robot_base_frame: robot_a_base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8

# Ramps every command: the real base ramps anyway, and FAST-LIO's pose
# spikes on instant velocity steps in sim. vy is held at 0.
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.3, 0.0, 0.4]
    min_velocity: [-0.3, 0.0, -0.4]
    max_accel: [0.4, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Last in the chain: velocity_smoother -> cmd_vel_smoothed -> here ->
# cmd_vel. Works on the raw sensors (not the costmaps, planner or
# controller) and slows/stops the base on its own: the backstop for a
# controller that has lost its pose and keeps sending an old command.
# Heights are in base_link (0.315 m above the floor): floor heights - 0.315. The Mid-360 goes through cloud_self_filter first
# (navigation.launch.py): it sees the arm, which would sit in every zone.
# The front camera is in twice: its latest cloud, and obstacle_memory (what
# it saw; a low obstacle is below its view by the time it's in a zone).
# Only while Nav2 drives: it publishes only when a command comes in, so
# other cmd_vel publishers (teleop, manipulation) are unaffected.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: robot_a_base_link
    odom_frame_id: robot_a_odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    # Approach only. No stop or slowdown zone: in this Nav2 both act on
    # every command whatever its direction. A stop zone held the base
    # still next to a remembered obstacle even when backing away from it
    # (with obstacle_memory, for good), and a slowdown zone held turns at
    # ~0.05 rad/s (RotationShim accelerates from the measured rate) until
    # Nav2 gave up beside a box (sim, 2026-09-27).
    # The local costmap's footprint (arm included, + footprint_padding),
    # moved along the current command: any direction, spins included. Slows
    # the command so that it's never less than time_before_collision from
    # a hit. (This Nav2 takes it from footprint_topic; 'points' is ignored
    # for approach.) cloud_self_filter's box is 1 cm bigger: the ring
    # between them is outside the body, so it holds no robot points.
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /robot_a/local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      max_points: 3
      visualize: true
      polygon_pub_topic: polygon_approach
      enabled: true
    observation_sources: [lidar, front_depth, front_memory]
    lidar:
      type: pointcloud
      topic: /robot_a/livox/lidar_self_filtered
      min_height: -0.265   # 0.05 m above the floor
      max_height: 1.185    # 1.5 m
      enabled: true
    front_depth:
      type: pointcloud
      topic: /robot_a/fixed_cam1_camera/depth/points_nav
      min_height: -0.265
      max_height: 1.185
      enabled: true
    # What the front camera has seen (obstacle_memory, odom): a low
    # obstacle is out of its view by the time it's in a zone.
    front_memory:
      type: pointcloud
      topic: /robot_a/fixed_cam1_camera/depth/obstacle_memory
      min_height: -0.265
      max_height: 1.185
      enabled: true
